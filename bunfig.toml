[install]
# 24h supply-chain guard: skip package versions published less than a day ago.
minimumReleaseAge = 86400
# Each entry bypasses the 24h guard for one package — confirm with the user
# before adding any. All entries are Incorta's own first-party packages
# (@incorta/auth is the platform-provisioned auth layer, @incorta/sdk the data
# client, @incorta/ui the design system): without the exemption, every release
# would break new-app installs for 24 hours.
minimumReleaseAgeExcludes = ["@incorta/auth", "@incorta/sdk", "@incorta/ui"]
